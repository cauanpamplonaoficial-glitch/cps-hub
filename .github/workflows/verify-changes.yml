name: Verify CPS Hub V2 changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm run lint
      - name: Run financial logic tests
        run: pnpm test
      - name: Build static Next.js app
        run: pnpm run build
